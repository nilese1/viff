# Auto-loaded by `docker compose up`. Provides the development workflow:
# - source bind-mounted for live reload
# - SQLite file persisted to ./data
# - no Postgres service needed
services:
  app:
    command: >
      uvicorn app.main:app
      --host 0.0.0.0 --port 8000
      --app-dir src
      --reload
    environment:
      APP_ENV: development
      SQLITE_PATH: /app/data/dev.db
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
      - ./data:/app/data
